[package]
name = "ros-launch-manifest-types"
version.workspace = true
edition.workspace = true
description = "Launch-manifest format: typed AST, YAML parser with spans, conditions and substitutions"
license.workspace = true
repository.workspace = true

[dependencies]
# Units and dimensions of a value read from the launch tree (phase 94): one
# unit table for the extension language and the core grammar. No z3.
rlx = { package = "ros-launch-manifest-rlx", path = "../rlx", default-features = false }
yaml-rust2 = "0.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
