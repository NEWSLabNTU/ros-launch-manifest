[package]
name = "ros-launch-manifest-rlx"
version.workspace = true
edition.workspace = true
description = "rlx, the extension language of launch manifests: character rules, parser and formatter"
license.workspace = true
repository.workspace = true

[lib]
name = "rlx"
path = "src/lib.rs"

[[bin]]
name = "rlx"
path = "src/main.rs"

[features]
# Worst-case proofs (phase 91 E5, `prove`), over z3. On by default, like the
# `check` crate's `smt`; a consumer that wants the front end and the
# evaluator without libz3/libclang on the host turns default features off.
# The z3 version must stay the `check` crate's: z3-sys declares
# `links = "z3"`, so two versions cannot be in one graph.
default = ["smt"]
smt = ["dep:z3"]

[dependencies]
z3 = { version = "0.12", optional = true }
unicode-normalization = "0.1"
sha2 = "0.10"

[dev-dependencies]
# The reference profiles' `functions:` (phase 91 E6) are rlx; their tests
# read the profiles where they ship.
ros-launch-manifest-types = { path = "../types" }
