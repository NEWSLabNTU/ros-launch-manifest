version: 1
nodes:
  producer:
    pub:
      out: {}
      out2: {}
    paths:
      make:
        trigger: aperiodic
        output: [out]
        max_latency: 40ms
      make_slow:
        trigger: { timer: { rate: 1Hz } }
        output: [out2]
        max_latency: 5ms
topics:
  /link/out:
    type: t
    pub: [producer/out]
  /link/out2:
    type: t
    pub: [producer/out2]
