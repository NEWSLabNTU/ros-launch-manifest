# Nested includes with imports/exports wiring across scope boundaries.
# Tests: inline includes, external includes, import/export resolution.
version: 1

nodes:
  driver:
    pub:
      raw_points:
        min_rate: 10Hz
    paths:
      periodic:
        output: [raw_points]
        max_latency: 1ms

topics:
  raw_points:
    type: sensor_msgs/msg/PointCloud2
    pub: [driver/raw_points]
    sub: [perception/cropbox/input]
    rate: 10Hz
    qos:
      reliability: best_effort

  detections_topic:
    type: autoware_msgs/msg/DetectedObjects
    pub: [perception/detector/objects]
    sub: [planning/planner/obstacles]
    rate: 10Hz

includes:
  perception:
    nodes:
      cropbox:
        sub:
          input:
            min_rate: 10Hz
        pub:
          cropped:
            min_rate: 10Hz
        paths:
          main:
            trigger: { input: [input] }
            output: [cropped]
            max_latency: 5ms

      detector:
        sub:
          points:
            min_rate: 10Hz
        pub:
          objects:
            min_rate: 10Hz
        paths:
          main:
            trigger: { input: [points] }
            output: [objects]
            max_latency: 30ms

    topics:
      filtered_points:
        type: sensor_msgs/msg/PointCloud2
        pub: [cropbox/cropped]
        sub: [detector/points]
        rate: 10Hz

    event_chains:
      detect:
        trigger: { input: [input] }
        output: [objects]
        max_latency: 40ms

  planning:
    nodes:
      planner:
        sub:
          obstacles:
            min_rate: 10Hz
            required: true
          route:
            state: true
            required: true
        pub:
          trajectory:
            min_rate: 10Hz
        paths:
          main:
            trigger: { input: [obstacles] }
            output: [trajectory]
            max_latency: 20ms

    topics:
      route_topic:
        type: autoware_msgs/msg/Route
        pub: []
        sub: [planner/route]
        qos:
          reliability: reliable
          durability: transient_local

    event_chains:
      plan:
        trigger: { input: [obstacles] }
        output: [trajectory]
        max_latency: 25ms

event_chains:
  end_to_end:
    trigger: { input: [sensor_data] }
    output: [trajectory]
    max_latency: 80ms
