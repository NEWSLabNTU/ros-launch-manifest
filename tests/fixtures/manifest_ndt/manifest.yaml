# NDT localization with state feedback, required endpoints.
# Tests: state edges, required markers, feedback cycle (not a causal cycle).
version: 1

nodes:
  voxel_grid:
    sub:
      raw_points:
        min_rate_hz: 10
        required: true
    pub:
      downsampled:
        min_rate_hz: 10
    paths:
      main:
        input: raw_points
        output: [downsampled]
        max_latency: 3ms

  ndt_scan_matcher:
    sub:
      input_points:
        min_rate_hz: 10
      initial_pose:
        state: true
        required: true
      map:
        state: true
        required: true
    pub:
      ndt_pose:
        min_rate_hz: 10
    paths:
      main:
        input: input_points
        output: [ndt_pose]
        max_latency: 30ms
    # The service type is declared once, on `services.trigger_ndt.type`.
    # This endpoint used to repeat it as `request: std_srvs/srv/Trigger`, a
    # key the parser never read — the only dead key in the whole 42-file
    # corpus when phase 69 measured it.
    srv: [trigger_node]

  ekf_localizer:
    sub:
      ndt_pose:
        min_rate_hz: 10
      imu:
        min_rate_hz: 50
        state: true
    pub:
      ekf_pose:
        min_rate_hz: 50
    paths:
      main:
        input: ndt_pose
        output: [ekf_pose]
        max_latency: 5ms
      imu_update:
        input: imu
        output: [ekf_pose]
        max_latency: 2ms

topics:
  # Absolute — external inputs from sensing and map subsystems.
  /sensing/lidar/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    sub: [voxel_grid/raw_points]
    rate_hz: 10
    qos:
      reliability: best_effort

  /sensing/imu/imu_raw:
    type: sensor_msgs/msg/Imu
    sub: [ekf_localizer/imu]
    rate_hz: 50
    qos:
      reliability: best_effort

  /map/pointcloud_map:
    type: sensor_msgs/msg/PointCloud2
    sub: [ndt_scan_matcher/map]
    qos:
      reliability: reliable
      durability: transient_local

  # Relative — intra-scope localization topics.
  downsampled_points:
    type: sensor_msgs/msg/PointCloud2
    pub: [voxel_grid/downsampled]
    sub: [ndt_scan_matcher/input_points]
    rate_hz: 10
    qos:
      reliability: best_effort

  ndt_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: [ndt_scan_matcher/ndt_pose]
    sub: [ekf_localizer/ndt_pose]
    rate_hz: 10
    qos:
      reliability: reliable

  # State topic — feedback from EKF to NDT (initial_pose). Not a causal edge.
  ekf_initial_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    pub: [ekf_localizer/ekf_pose]
    sub: [ndt_scan_matcher/initial_pose]
    rate_hz: 50
    qos:
      reliability: reliable
      durability: transient_local

services:
  trigger_ndt:
    type: std_srvs/srv/Trigger
    server: [ndt_scan_matcher/trigger_node]

paths:
  localization:
    input: /sensing/lidar/pointcloud
    output: [ekf_initial_pose]
    max_latency: 50ms
