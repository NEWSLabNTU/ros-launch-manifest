# Publisher side of a cross-scope topic.
# Declares full contract (type + rate_hz).
version: 1

nodes:
  source:
    pub:
      out:
        min_rate: 10Hz

topics:
  shared_data:
    type: std_msgs/msg/String
    pub: [source/out]
    rate: 10Hz
    qos:
      reliability: reliable
      durability: volatile
