# Timer-driven node: controller reads state topics and publishes periodically.
# Tests: paths with no input trigger, state endpoints, rate chain.
version: 1

nodes:
  localization:
    pub:
      current_pose:
        min_rate: 50Hz
    paths:
      periodic:
        output: [current_pose]
        max_latency: 2ms

  trajectory_planner:
    sub:
      current_pose:
        state: true
      route:
        state: true
        required: true
    pub:
      trajectory:
        min_rate: 10Hz
    paths:
      periodic:
        output: [trajectory]
        max_latency: 30ms

  controller:
    sub:
      trajectory:
        state: true
      current_velocity:
        state: true
    pub:
      control_cmd:
        min_rate: 30Hz
    paths:
      periodic:
        output: [control_cmd]
        max_latency: 5ms

topics:
  current_pose:
    type: geometry_msgs/msg/PoseStamped
    pub: [localization/current_pose]
    sub: [trajectory_planner/current_pose]
    rate: 50Hz
    qos:
      reliability: reliable

  route:
    type: autoware_msgs/msg/Route
    pub: []
    sub: [trajectory_planner/route]
    qos:
      reliability: reliable
      durability: transient_local

  trajectory:
    type: autoware_msgs/msg/Trajectory
    pub: [trajectory_planner/trajectory]
    sub: [controller/trajectory]
    rate: 10Hz
    qos:
      reliability: reliable

  current_velocity:
    type: geometry_msgs/msg/TwistStamped
    pub: []
    sub: [controller/current_velocity]
    rate: 50Hz
    qos:
      reliability: best_effort

  control_cmd:
    type: autoware_msgs/msg/ControlCommand
    pub: [controller/control_cmd]
    sub: []
    rate: 30Hz

