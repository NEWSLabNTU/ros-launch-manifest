version: 1
nodes:
  consumer:
    sub:
      in: {}
      in2: {}
    paths:
      consume:
        trigger: { input: [in] }
        output: []
        max_latency: 40ms
      consume2:
        trigger: { input: [in2] }
        output: []
        max_latency: 10ms
topics:
  /link/out:
    type: t
    sub: [consumer/in]
  /link/out2:
    type: t
    sub: [consumer/in2]
